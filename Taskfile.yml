# https://taskfile.dev
version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  install:
    desc: Install npm dependencies
    cmds:
      - npm install
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.package-lock.json

  dev:
    desc: Start the Vite dev server
    deps: [install]
    cmds:
      - npm run dev

  format:
    desc: Format all files with Prettier
    deps: [install]
    cmds:
      - npm run format

  format:check:
    desc: Check formatting without writing
    deps: [install]
    cmds:
      - npm run format:check

  lint:
    desc: Lint TS/TSX (oxlint) and CSS (stylelint)
    deps: [install]
    cmds:
      - npm run lint

  typecheck:
    desc: Type-check without emitting
    deps: [install]
    cmds:
      - npm run typecheck

  test:
    desc: Run tests once
    deps: [install]
    cmds:
      - npm test

  test:watch:
    desc: Run tests in watch mode
    deps: [install]
    cmds:
      - npm run test:watch

  build:
    desc: Type-check and build to dist/
    deps: [install]
    cmds:
      - npm run build

  preview:
    desc: Serve the production build locally
    deps: [build]
    cmds:
      - npm run preview

  check:
    desc: Everything CI runs — format check, lint, test, build
    cmds:
      - task: format:check
      - task: lint
      - task: test
      - task: build

  clean:
    desc: Remove build output
    cmds:
      - rm -rf dist
